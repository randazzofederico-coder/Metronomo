<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Metrónomo profesional con motor de audio nativo, subdivisiones, acentos, birritmia y control preciso de tempo.">

  <!-- PWA meta tags -->
  <meta name="theme-color" content="#1E1A17">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metrónomo">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-maskable-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-maskable-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Metrónomo Musical</title>
  <link rel="manifest" href="manifest.json">
  <script src="live_mixer.js"></script>
  <style>
    body {
      background-color: #1E1A17;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .app-icon {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .loader {
      border: 3px solid rgba(249, 133, 51, 0.15);
      border-left-color: #F98533;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="flutter-loader">
    <img src="icons/Icon-192.png" alt="Metrónomo" class="app-icon" />
    <div class="loader"></div>
  </div>
  <script>
    // PWA Install bridge for Flutter
    function _flutterPwaPrompt(event) {
      if (event && event.prompt) {
        event.prompt();
      }
    }
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('flutter-loader');
      if (loader) {
        loader.style.display = 'none';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
